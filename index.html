<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>按钮喵</title>
    <style>
        body{
            height: 100vh;
            margin:0;
            display:flex;
            justify-content: center;
            align-items: center;
            /* background: linear-gradient( 135deg,#f393b9,#b11f61); */
            transition: all 0.25s ease-out;
            background-image: radial-gradient(circle,#a565dd 50%,transparent 50%);
            background-size: 0.1% 0.1%;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-size 2s cubic-bezier(0.4,0,0.2,1);

        }
        .twillight{
            color:white;
            font-size: 50px;

        }
        .pony{
            width: 150px;
            height: 150px;
            border: none;
            /* background-color: #0f0f12; */
            background: linear-gradient(135deg,#a565dd,#380c3d);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8), inset 0 4px 10px rgba(255,255,255,0.8);
            transition: all 0.25s ease-out;

        }
        .pony svg{
            width:80px;
            height:80px;
            

        }
        .pony:hover{
            /* 这是按钮的悬浮状态 */
            transform: translateY(-5px);
             box-shadow: 0 10px 50px rgba(0,0,0,0.8), inset 0 4px 10px rgba(255,255,255,0.8);

        }
        .pony:active{
            background: linear-gradient( 135deg,#f393b9,#b11f61);
            transform: translateY(3px)
            scale(0.8);
            box-shadow: 0 10px 50px rgba(0,0,0,0.8), inset 0 4px 10px rgba(255,255,255,0.8);
            
        }
        body:has(.pony:active){
               background-size: 300% 300%;
            }
    </style>
</head>
